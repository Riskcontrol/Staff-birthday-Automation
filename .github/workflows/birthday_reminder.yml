name: Daily Birthday Reminder

on:
  schedule:
    # 08:00 UTC = 09:00 in Nigeria (WAT).
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send-birthday-reminder:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas openpyxl

      - name: Send birthday reminder
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          HR_EMAIL: ${{ secrets.HR_EMAIL || 'hr@riskcontrolnigeria.com' }}
          TZ: ${{ secrets.TIMEZONE || 'Africa/Lagos' }}
          SHAREPOINT_URL: ${{ secrets.SHAREPOINT_URL }}
        run: python send_birthdays.py
